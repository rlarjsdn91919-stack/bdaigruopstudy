<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDAI 조별활동</title>
<meta name="description" content="BDAI 13기 LMS 조별활동 탭 프로토타입">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ctext y='16' font-size='16'%3E%F0%9F%91%A5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
</head>
<body>
<style>
:root {
  --gray-0:#ffffff; --gray-25:#f7f8fa; --gray-50:#f9fafb; --gray-100:#f2f4f6;
  --gray-200:#e5e8eb; --gray-300:#d1d6db; --gray-400:#b0b8c1; --gray-500:#8b95a1;
  --gray-600:#6b7684; --gray-700:#4e5968; --gray-800:#333d4b; --gray-900:#191f28;

  --navy-900:#07162a; --navy-800:#0b1f3a;
  --blue-600:#1d4ed8; --blue-500:#3182f6; --blue-50:#eff6ff; --blue-100:#bfdbfe;

  --success-fg:#047857; --success-bg:#ecfdf5; --success-bd:#a7f3d0;
  --warning-fg:#92400e; --warning-bg:#fffbeb; --warning-bd:#fde68a;
  --danger-fg:#b91c1c;  --danger-bg:#fef2f2;  --danger-bd:#fecaca;
  --info-fg:#6d28d9;    --info-bg:#f5f3ff;    --info-bd:#ddd6fe;
  --muted-fg:#6b7684;   --muted-bg:#f9fafb;   --muted-bd:#e5e8eb;

  --color-bg:var(--gray-25); --color-surface:var(--gray-0);
  --color-surface-soft:var(--gray-100); --color-border:var(--gray-200);
  --color-border-strong:var(--gray-300); --color-text:var(--gray-700);
  --color-text-strong:var(--gray-900); --color-text-muted:var(--gray-600);
  --color-text-disabled:var(--gray-500); --color-primary:var(--navy-800);
  --color-accent:var(--blue-500); --color-focus:rgba(49,130,246,.15);

  --font:"Pretendard","Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --fs-caption:11px; --fs-small:12px; --fs-label:13px; --fs-body:14px;
  --fs-lead:16px; --fs-h3:18px; --fs-h2:22px; --fs-h1:28px;
  --lh-tight:1.35; --lh-body:1.5; --lh-loose:1.7;
  --fw-regular:400; --fw-semi:600; --fw-bold:700; --fw-x:800;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;

  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --sh-none:none; --sh-sm:0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(15,23,42,.08); --sh-overlay:0 20px 50px rgba(0,0,0,.2);

  --h-header:52px; --w-page:1280px; --w-side:320px; --w-rail:72px; --gutter:24px;
  --dur-fast:120ms; --dur:160ms; --dur-slow:240ms; --ease:cubic-bezier(.2,.8,.2,1);
  --z-sticky:100; --z-dropdown:200; --z-overlay:900; --z-modal:1000; --z-toast:1100;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
body{margin:0;background:var(--color-bg);color:var(--color-text);
  font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font);
  word-break:keep-all;-webkit-font-smoothing:antialiased;}
h1,h2,h3,p,ul,ol,figure{margin:0;}
ul{padding:0;list-style:none;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
svg{display:block;flex:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:var(--r-sm);}

/* ── 타이포 ───────────────────────────────── */
.display{font-size:var(--fs-h1);font-weight:var(--fw-x);line-height:var(--lh-tight);
  color:var(--color-text-strong);letter-spacing:-.02em;}
.h2{font-size:var(--fs-h2);font-weight:var(--fw-bold);line-height:var(--lh-tight);color:var(--color-text-strong);}
.h3{font-size:var(--fs-h3);font-weight:var(--fw-bold);line-height:1.4;color:var(--color-text-strong);}
.lead{font-size:var(--fs-lead);font-weight:var(--fw-semi);line-height:var(--lh-body);color:var(--color-text-strong);}
.label{font-size:var(--fs-label);font-weight:var(--fw-semi);line-height:1.4;color:var(--color-text-strong);}
.small{font-size:var(--fs-small);color:var(--color-text-muted);}
.caption{font-size:var(--fs-caption);line-height:1.4;color:var(--color-text-disabled);}
.prose{max-width:72ch;}
.num{font-variant-numeric:tabular-nums;}

/* ── 헤더 ─────────────────────────────────── */
.header{position:sticky;top:0;z-index:var(--z-sticky);height:var(--h-header);
  background:var(--color-surface);border-bottom:1px solid var(--color-border);}
.header-in{max-width:var(--w-page);margin:0 auto;padding:0 var(--gutter);height:100%;
  display:flex;align-items:center;gap:var(--sp-6);}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-lead);
  font-weight:var(--fw-x);color:var(--color-text-strong);letter-spacing:-.02em;}
.brand svg{color:var(--color-accent);}
.gnb{display:flex;align-items:center;gap:var(--sp-1);margin-left:auto;overflow-x:auto;}
.nav-link{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-label);
  font-weight:var(--fw-semi);color:var(--color-text-muted);white-space:nowrap;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.nav-link:hover{background:var(--color-surface-soft);color:var(--color-text-strong);}
.nav-link[aria-current="page"]{background:var(--color-surface-soft);color:var(--color-text-strong);}
.bell{position:relative;display:flex;align-items:center;gap:var(--sp-1);
  background:none;border:0;padding:var(--sp-2);border-radius:var(--r-md);
  color:var(--color-text-muted);cursor:pointer;}
.bell:hover{background:var(--color-surface-soft);}
.count{min-width:16px;height:16px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--color-accent);color:var(--gray-0);
  font:var(--fw-x) var(--fs-caption)/16px var(--font);text-align:center;}

/* ── 레이아웃 ─────────────────────────────── */
.page{max-width:var(--w-page);margin:0 auto;padding:var(--sp-6) var(--gutter) var(--sp-16);}
.subnav{background:var(--color-surface);border-bottom:1px solid var(--color-border);}
.subnav-in{max-width:var(--w-page);margin:0 auto;padding:0 var(--gutter);
  display:flex;gap:var(--sp-1);overflow-x:auto;}
.subnav-in .nav-link{padding:var(--sp-3) var(--sp-3);border-radius:0;}
.sidetab{display:grid;gap:var(--sp-5);grid-template-columns:240px minmax(0,1fr);align-items:start;}
.stack{display:flex;flex-direction:column;gap:var(--sp-5);}
.stack-sm{display:flex;flex-direction:column;gap:var(--sp-3);}
.row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;}
.grid3{display:grid;gap:var(--sp-4);grid-template-columns:repeat(3,minmax(0,1fr));}
.grid5{display:grid;gap:var(--sp-4);grid-template-columns:repeat(auto-fill,minmax(224px,1fr));}
@media (max-width:960px){
  .sidetab{grid-template-columns:1fr;}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:640px){
  .grid3{grid-template-columns:1fr;}
  .page{padding:var(--sp-5) var(--sp-4) var(--sp-12);}
  .header-in,.subnav-in{padding:0 var(--sp-4);}
}

/* ── 카드 ─────────────────────────────────── */
.card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--sh-none);}
.card-lg{padding:var(--sp-5) var(--sp-6);border-radius:var(--r-xl);}
.card-int{transition:border-color var(--dur) var(--ease);display:block;width:100%;text-align:left;
  cursor:pointer;font:inherit;color:inherit;}
.card-int:hover{border-color:var(--color-border-strong);}
.soft{background:var(--color-surface-soft);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);}

/* ── 스탯 4열 ─────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;
  background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-xl);overflow:hidden;}
.stat{padding:var(--sp-4);border-left:1px solid var(--color-border);
  display:flex;flex-direction:column;gap:var(--sp-2);}
.stat:first-child{border-left:0;}
.stat-head{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-small);
  font-weight:var(--fw-semi);color:var(--color-text-muted);}
.stat-head svg{color:var(--color-text-disabled);}
.stat-val{font-size:var(--fs-h2);font-weight:var(--fw-x);color:var(--color-text-strong);
  font-variant-numeric:tabular-nums;line-height:var(--lh-tight);}
.stat-val small{font-size:var(--fs-label);font-weight:var(--fw-semi);color:var(--color-text-muted);}
@media (max-width:960px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));}
  .stat:nth-child(3){border-left:0;}
  .stat:nth-child(n+3){border-top:1px solid var(--color-border);}}
@media (max-width:640px){.stats{grid-template-columns:1fr;}
  .stat{border-left:0;} .stat:nth-child(n+2){border-top:1px solid var(--color-border);}}

/* ── 버튼 ─────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  font:var(--fw-semi) var(--fs-label)/1 var(--font);border-radius:var(--r-md);
  padding:9px 14px;cursor:pointer;border:1px solid transparent;background:none;
  color:var(--color-text-strong);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.btn-sm{font-size:var(--fs-small);padding:6px 10px;}
.btn-lg{font-size:var(--fs-body);padding:12px 18px;}
.btn-primary{background:var(--color-primary);color:var(--gray-0);}
.btn-primary:hover{background:var(--navy-900);}
.btn-secondary{border-color:var(--color-border);color:var(--gray-800);}
.btn-secondary:hover{background:var(--color-surface-soft);}
.btn-soft{background:var(--blue-50);color:var(--blue-600);border-color:var(--blue-100);border-radius:var(--r-pill);}
.btn-soft:hover{background:var(--blue-100);}
.btn-ghost{color:var(--color-text-muted);}
.btn-ghost:hover{background:var(--color-surface-soft);color:var(--color-text-strong);}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-bd);}
.btn-block{width:100%;}

/* ── 뱃지 ─────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;
  font:var(--fw-bold) var(--fs-small)/1 var(--font);padding:4px 10px;border-radius:var(--r-pill);}
.badge-success{background:var(--success-bg);color:var(--success-fg);}
.badge-warning{background:var(--warning-bg);color:var(--warning-fg);}
.badge-danger{background:var(--danger-bg);color:var(--danger-fg);}
.badge-info{background:var(--info-bg);color:var(--info-fg);}
.badge-muted{background:var(--muted-bg);color:var(--muted-fg);}
.badge-brand{background:var(--blue-50);color:var(--blue-600);}
.badge-sm{font-size:var(--fs-caption);padding:3px 8px;}

/* ── 세로 탭 ──────────────────────────────── */
.vtabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;}
.vtab{display:flex;align-items:center;gap:var(--sp-3);padding:10px var(--sp-3);
  border-radius:var(--r-md);border:0;border-left:3px solid transparent;background:none;
  cursor:pointer;text-align:left;color:var(--color-text-muted);
  font:var(--fw-semi) var(--fs-body)/1.4 var(--font);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.vtab:hover{background:var(--color-surface-soft);color:var(--color-text-strong);}
.vtab[aria-selected="true"]{background:var(--blue-50);color:var(--color-text-strong);border-left-color:var(--color-accent);}
.vtab-sub{display:block;font-size:var(--fs-small);font-weight:var(--fw-regular);color:var(--color-text-muted);}
.vtabs-head{padding:var(--sp-2) var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);}
@media (max-width:960px){
  .vtabs{position:static;flex-direction:row;overflow-x:auto;gap:var(--sp-1);
    border-bottom:1px solid var(--color-border);padding-bottom:var(--sp-2);}
  .vtab{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:var(--r-md) var(--r-md) 0 0;}
  .vtab[aria-selected="true"]{border-bottom-color:var(--color-accent);}
  .vtab .vtab-sub{display:none;}
}

/* ── 필터 ─────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;}
.chipset{display:flex;gap:var(--sp-1);background:var(--color-surface-soft);
  padding:var(--sp-1);border-radius:var(--r-md);}
.chip{display:inline-flex;align-items:center;gap:var(--sp-2);text-decoration:none;
  border:0;background:none;cursor:pointer;padding:6px 12px;border-radius:var(--r-sm);
  font:var(--fw-semi) var(--fs-label)/1 var(--font);color:var(--color-text-muted);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--color-surface);color:var(--color-text-strong);box-shadow:var(--sh-sm);}
.subnav-2{border-top:1px solid var(--color-border);}
.subnav-2 .subnav-in{padding-top:var(--sp-2);padding-bottom:var(--sp-2);}
.field{display:flex;flex-direction:column;gap:var(--sp-1);}
.field > span{font-size:var(--fs-caption);font-weight:var(--fw-semi);color:var(--color-text-muted);}
.input,.select,.textarea{height:40px;padding:0 12px;border-radius:var(--r-md);
  border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-strong);
  font:var(--fw-regular) var(--fs-body) var(--font);}
.textarea{height:auto;padding:10px 12px;line-height:var(--lh-body);resize:vertical;}
.input::placeholder,.textarea::placeholder{color:var(--gray-400);}
.input:focus,.select:focus,.textarea:focus{border-color:var(--color-accent);
  box-shadow:0 0 0 3px var(--color-focus);outline:none;}
.select{padding-right:var(--sp-8);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--gray-500) 50%),linear-gradient(135deg,var(--gray-500) 50%,transparent 50%);
  background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

/* ── 표 ───────────────────────────────────── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{font:var(--fw-bold) var(--fs-small)/1.4 var(--font);color:var(--color-text-muted);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--color-border);white-space:nowrap;}
td{font-size:var(--fs-label);color:var(--gray-800);padding:12px;border-bottom:1px solid var(--color-border);}
tbody tr:hover{background:var(--gray-50);}
.t-num{text-align:right;font-variant-numeric:tabular-nums;}
tfoot td{font-weight:var(--fw-bold);background:var(--color-surface-soft);}

/* ── 기타 ─────────────────────────────────── */
.callout{border-left:3px solid var(--tone-fg,var(--color-accent));background:var(--tone-bg,var(--blue-50));
  border-radius:0 var(--r-md) var(--r-md) 0;padding:var(--sp-3) var(--sp-4);
  font-size:var(--fs-label);color:var(--gray-800);display:flex;gap:var(--sp-3);align-items:flex-start;}
.callout svg{color:var(--tone-fg,var(--color-accent));margin-top:1px;}
.tone-info{--tone-fg:var(--info-fg);--tone-bg:var(--info-bg);}
.tone-warn{--tone-fg:var(--warning-fg);--tone-bg:var(--warning-bg);}
.tone-ok{--tone-fg:var(--success-fg);--tone-bg:var(--success-bg);}
.progress{height:8px;border-radius:var(--r-pill);background:var(--gray-100);overflow:hidden;}
.progress > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--color-primary);}
.empty{text-align:center;padding:var(--sp-12) var(--sp-4);color:var(--color-text-muted);font-size:var(--fs-label);
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);}
.empty svg{color:var(--gray-400);}
.divide > * + *{border-top:1px solid var(--color-border);}
.listrow{display:flex;gap:var(--sp-4);padding:var(--sp-4) 0;align-items:flex-start;}
.listrow:first-child{padding-top:var(--sp-2);}
.avatar{width:32px;height:32px;border-radius:var(--r-pill);background:var(--color-surface-soft);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);
  font:var(--fw-bold) var(--fs-small)/1 var(--font);flex:none;}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);
  gap:var(--sp-4);overflow-x:auto;padding-bottom:var(--sp-2);}
.link{color:var(--blue-600);font-weight:var(--fw-semi);}
.link:hover{text-decoration:underline;}
.likebtn{display:inline-flex;align-items:center;gap:var(--sp-1);border:0;background:none;cursor:pointer;
  color:var(--color-text-disabled);font:var(--fw-semi) var(--fs-small) var(--font);padding:var(--sp-1);border-radius:var(--r-sm);}
.likebtn[aria-pressed="true"]{color:var(--danger-fg);}
.stars{font-weight:var(--fw-x);font-size:var(--fs-lead);color:var(--color-text-strong);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:var(--sp-1);}
.stars svg{color:var(--warning-fg);}
.crumb{display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-small);color:var(--color-text-muted);}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;}

/* ── 성장 여정 (Team → Share → Challenge → Shine) ── */
.journey-head{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}
.journey-flow{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  font:var(--fw-x) var(--fs-label)/1 var(--font);color:var(--color-text-strong);letter-spacing:-.01em;}
.journey-flow i{font-style:normal;color:var(--gray-400);font-weight:var(--fw-bold);}
.journey-note{max-width:34ch;text-align:right;}
.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4);
  list-style:none;margin:0;padding:0;}
.jstep{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0;}
.jrail{position:relative;height:40px;display:flex;align-items:center;justify-content:center;}
.jrail::before{content:"";position:absolute;top:50%;left:calc(-50% - var(--sp-4));right:50%;
  height:2px;background:var(--color-border);transform:translateY(-50%);}
.journey > .jstep:first-child .jrail::before{display:none;}
.jstep.is-done .jrail::before,.jstep.is-now .jrail::before{background:var(--color-accent);}
.jnode{position:relative;width:40px;height:40px;border-radius:var(--r-pill);
  background:var(--color-surface);border:2px solid var(--color-border);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-disabled);}
.jstep.is-done .jnode{background:var(--color-accent);border-color:var(--color-accent);color:var(--gray-0);}
.jstep.is-now .jnode{border-color:var(--color-accent);color:var(--color-accent);
  box-shadow:0 0 0 5px var(--color-focus);}
.jcard{flex:1;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--r-lg);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);}
.jstep.is-now .jcard{border-color:var(--color-accent);box-shadow:var(--sh-md);}
.jstep.is-next .jcard{background:var(--gray-25);}
.jen{font:var(--fw-x) var(--fs-h2)/1.2 var(--font);color:var(--color-text-strong);letter-spacing:-.02em;}
.jstep.is-next .jen{color:var(--color-text-muted);}
.jko{font:var(--fw-bold) var(--fs-body)/1.4 var(--font);color:var(--color-accent);}
.jstep.is-next .jko{color:var(--color-text-disabled);}
@media (max-width:960px){

/* ─────────────────────────────────────────────

const ymd = (y,m,dd)=>`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
function spanOf(key){ return CAL_SPANS.find(sp=>key>=sp.from && key<=sp.to); }
function calMonthEvents(m){ return CAL.filter(e=>e.d.slice(0,7)===m).sort((a,b)=>a.d<b.d?-1:1); }
function calRangeLabel(e){ return e.to ? `${fmt(e.d).slice(3)} ~ ${fmt(e.to).slice(3)}` : fmt(e.d).slice(3); }
function calendarBoard(){
  const m = S.cal, i = CAL_MONTHS.indexOf(m);
  const [Y, M] = m.split('-').map(Number);
  const lead = new Date(Y, M-1, 1).getDay();
  const dim = new Date(Y, M, 0).getDate(), prevDim = new Date(Y, M-1, 0).getDate();
  const cells = [];
  for(let n = 1 - lead; n <= 42 - lead; n++){
    let y = Y, mo = M, day = n, out = false;
    if(n < 1){ out = true; day = prevDim + n; mo = M-1; if(mo < 1){ mo = 12; y = Y-1; } }
    else if(n > dim){ out = true; day = n - dim; mo = M+1; if(mo > 12){ mo = 1; y = Y+1; } }
    cells.push({key:ymd(y,mo,day), day, out});
  }
  const weeks = [];
  for(let w = 0; w < 42; w += 7) weeks.push(cells.slice(w, w+7));
  while(weeks.length > 4 && weeks[weeks.length-1].every(c=>c.out)) weeks.pop();

  const dows = ['일','월','화','수','목','금','토'];
  const list = calMonthEvents(m);

  return `<section class="card card-lg stack-sm">
    <div class="sec-head">
      <div><h2 class="h2">조별활동 캘린더</h2>
        <p class="small" style="margin-top:var(--sp-1)">활동 기간 · 제출 마감 · 채점 일정을 한 달 단위로 확인해요.</p></div>
      <div class="cal-nav">
        <button class="icon-btn rot" type="button" data-act="cal" data-m="${CAL_MONTHS[i-1]||''}"
          ${i<=0?'disabled':''} aria-label="이전 달">${ic('chevron',16)}</button>
        <span class="cal-title">${Y}년 ${M}월</span>
        <button class="icon-btn" type="button" data-act="cal" data-m="${CAL_MONTHS[i+1]||''}"
          ${i>=CAL_MONTHS.length-1?'disabled':''} aria-label="다음 달">${ic('chevron',16)}</button>
        <button class="btn btn-secondary btn-sm" type="button" data-act="cal" data-m="${TODAY_YMD.slice(0,7)}">오늘</button>
      </div>
    </div>

    <div class="cal-wrap" style="margin-top:var(--sp-2)">
      <div class="stack-sm">
        <table class="cal-table">
          <caption class="skip">${Y}년 ${M}월 조별활동 일정</caption>
          <thead><tr>${dows.map((d2,x)=>`<th scope="col" class="${x===0?'sun':x===6?'sat':''}">${d2}</th>`).join('')}</tr></thead>
          <tbody>${weeks.map(w=>`<tr>${w.map((c,x)=>{
            const sp = c.out ? null : spanOf(c.key);
            const evs = CAL.filter(e=>e.d===c.key);
            const cls = ['cday', x===0?'sun':x===6?'sat':'', c.out?'is-out':'',
              c.key===TODAY_YMD?'is-today':'', sp?'sp-'+sp.k:''].filter(Boolean).join(' ');
            return `<td><div class="${cls}">
              <span class="cday-n">${c.day}</span>
              ${c.out?'':evs.map(e=>`<span class="cev k-${e.k}" title="${esc(e.t)}">${esc(e.t)}</span>`).join('')}
              ${c.out||!evs.length?'':`<span class="cdots">${evs.map(e=>`<i class="k-${e.k}" style="background:currentColor"></i>`).join('')}</span>`}
            </div></td>`;
          }).join('')}</tr>`).join('')}</tbody>
        </table>
        <div class="cal-legend">
          <span><b style="background:#edf4ff;border:1px solid var(--blue-100)"></b>활동 기간</span>
          <span><b style="background:#fff6e6;border:1px solid var(--warning-bd)"></b>채점 기간</span>
          <span><b style="background:#f4efff;border:1px solid var(--info-bd)"></b>추가모집</span>
          <span><b style="background:var(--danger-bg);border:1px solid var(--danger-bd)"></b>제출 마감</span>
          <span><b style="background:var(--blue-50);border:1px solid var(--blue-100)"></b>활동 시작</span>
        </div>
      </div>

      <div class="card stack-sm">
        <div class="row" style="gap:var(--sp-2)">${ic('calendar',16)}<h3 class="h3" style="font-size:var(--fs-lead)">${M}월 일정</h3></div>
        ${list.length ? `<div class="cal-list">${list.map(e=>{
          const n = dday(e.to||e.d);
          return `<div class="cal-item"${n<0?' style="opacity:.55"':''}>
            <span class="cal-date">${calRangeLabel(e)}</span>
            <div style="min-width:0;flex:1">
              <p class="label">${esc(e.t)}</p>
              <div class="row" style="gap:var(--sp-2);margin-top:var(--sp-1)">
                <span class="badge badge-sm k-${e.k}">${CAL_KIND[e.k].t}</span>
                <span class="caption num">${n<0?'지난 일정':(n===0?'D-DAY':'D-'+n)}</span>
              </div>
            </div>
          </div>`;
        }).join('')}</div>`
        : `<div class="empty" style="padding:var(--sp-8) var(--sp-2)">${ic('calendar',28)}
            <p>이 달에는 예정된 조별활동 일정이 없어요.</p></div>`}
      </div>
    </div>
  </section>`;
}

        </div>

  </div>`;

function filteredReviews(){
  const f = S.f.rev;
  return REVIEWS.filter(r=>{
    const g = G(r.gid);
    if(f.pid!=='all' && r.pid!==f.pid) return false;

    if(f.cls!=='all'){ if(f.cls==='none'){ if(g.classId) return false; } else if(g.classId!==f.cls) return false; }
    return true;
  });
}

const reviewSpec = (track, pid) => pid==='p2' ? REVIEWSPEC.p2[track] : REVIEWSPEC.common;

/* ── 판정 ──────────────────────────────────── */
const tri = (ok,total) => total===0 ? 0 : (ok===total ? .8 : (ok===0 ? 0 : .4));

function readLogForm(root){
  const track = root.dataset.track;
  const pid = root.querySelector('[name=pid]').value;
  const spec = logSpec(G(root.dataset.gid) || {track:track}, pid, root.dataset.stage);
  const val = n => { const el = root.querySelector(`[name="${n}"]`); return el ? el.value : ''; };
  const chk = n => { const el = root.querySelector(`[name="${n}"]`); return !!(el && el.checked); };
  const files = n => { const el = root.querySelector(`[name="${n}"]`);
    return el && el.files ? Array.prototype.map.call(el.files, f=>f.name) : []; };
  const part = key => {
    const sec = spec[key];
    if(sec.viaReview) return {viaReview:true, items:[], ok:0, total:0};
    if(sec.choice){
      const pickV = val(key+'-pick'), body = val(key+'-body');
      const opt = sec.choice.find(o=>o.v===pickV) || sec.choice[0];
      return {choice:true, pick:opt, body, items:[{k:'body', l:opt.l, min:opt.min, v:body}],
              ok: clen(body)>=opt.min ? 1 : 0, total:1};
    }
    const items = sec.items.map(it=>Object.assign({}, it, {v: val(key+'-'+it.k)}));
    return {items, ok: items.filter(it=>clen(it.v)>=it.min).length, total: items.length};
  };
  return {
    pid, track, spec, m1: part('m1'), m2: part('m2'),
    off: Math.max(0, Number(val('offmeet')||0)), on: Math.max(0, Number(val('onmeet')||0)),
    title: val('title'), join: Number(val('join')||0),
    photoF: files('photo'), docF: files('doc'),
    photo: files('photo').length>0, doc: files('doc').length>0,
    e1: chk('e1'), e3: chk('e3'),
    e1f: files('e1file'), e1memo: val('e1-memo'),
    e3f: files('e3file'), e3name: val('e3name'), e3memo: val('e3-memo'),
    cname: val('cname'), cdue: val('cdue'), calt: val('calt')
  };
}

function autoJudge(g, f){
  const p = period(f.pid);
  const off = Math.max(0, f.off||0), on = Math.max(0, f.on||0);

  const M1 = tri(f.m1.ok, f.m1.total);
  const M3 = (off>=1 || on>=2) ? .8 : (on===1 ? .4 : 0);
  const needed = off>=1 ? 1 : (on>=2 ? 2 : 0);
  const extra = needed ? Math.min(4, off + on - needed) : 0;
  const okc = [f.photo, f.doc, f.join>=quorum(memberCount(g))].filter(Boolean).length;
  const M4 = okc===3 ? .8 : (okc===0 ? 0 : .4);
  const rv = REVIEWS.find(r=>r.gid===g.id && r.pid===f.pid);
  const M5 = rv ? (rv.score==null ? .8 : rv.score) : 0;
  const M2 = f.m2.viaReview ? M5 : tri(f.m2.ok, f.m2.total);

  const eOk = {
    e1: !!f.e1 && (f.e1f||[]).length>0 && clen(f.e1memo)>=20,
    e3: !!f.e3 && (f.e3f||[]).length>0 && String(f.e3name||'').trim().length>0 && clen(f.e3memo)>=20
  };
  const ePicked = [f.e1,f.e3].filter(Boolean).length;
  const bonusN = [eOk.e1,eOk.e3].filter(Boolean).length + extra;
  const bonus = Math.min(2, bonusN) * .5;
  const late = dday(p.due) < 0 ? -.5 : 0;
  const req = M1 + M2 + M3 + M4 + M5;
  const total = Math.max(0, Math.min(5, req + bonus + late));
  return {M1, M2, M3, M4, M5, bonus, bonusN, extra, needed, ePicked, eOk, late, off, on, okc, req, total, rv};
}

/* 제출 유형은 고르게 하지 않고 작성 내용에서 도출한다.
   9월만 필수1(계획서)·필수2(일지)를 별도 문서로 내므로 그 달에만 갈린다. */
function deriveLoc(off, on){

function bonusNote(j){
  const L = {e1:'E1 자율활동', e3:'E3 공모전·자격증'};
  const parts = ['e1','e3'].map(k=>
    j.eOk[k] ? `<span class="badge badge-success badge-sm">${L[k]} 인정</span>` : null).filter(Boolean);
  if(j.extra>0) parts.unshift(`<span class="badge badge-success badge-sm">E2 추가 만남 ${j.extra}회</span>`);
  const pending = j.ePicked - j.bonusN;
  if(pending>0) parts.push(`<span class="badge badge-warning badge-sm">요건 미충족 ${pending}건</span>`);
  if(j.bonusN>2) parts.push(`<span class="badge badge-muted badge-sm">월 2건 상한 적용</span>`);
  return parts.length ? parts.join(' ') : '선택한 가산 항목 없음 — 건당 +0.5, 월 2건까지';
}

function wroteMonths(g, name){
  return REVIEWS.filter(r=>r.gid===g.id && r.author===name).map(r=>period(r.pid).label);
}
function readReviewForm(root){
  const gid = root.querySelector('[name=gid]').value;
  const g = G(gid) || MYGROUPS()[0];
  const pid = root.querySelector('[name=pid]').value;
  const spec = reviewSpec(g.track, pid);
  const answers = spec.map((q,i)=>{
    const el = root.querySelector(`[name="a${i}"]`);
    return el ? el.value : '';
  });
  return {g, pid, spec, answers,
          writer: (root.querySelector('[name=writer]')||{}).value || ''};
}
function judgeReview(f){
  const total = f.answers.reduce((a,s)=>a+clen(s), 0);
  const short = [];
  f.answers.forEach((s,i)=>{ if(clen(s) < f.spec[i].min) short.push('Q'+(i+1)); });
  const writerOk = !!f.writer;
  const late = dday(period(f.pid).due) < 0;
  const nothing = total===0;
  const score = nothing ? 0
    : (!writerOk || short.length || total < REV_MIN) ? .4 : .8;

  const queue = [];
  for(let i=0;i<f.answers.length;i++)
    for(let j=i+1;j<f.answers.length;j++)
      if(clen(f.answers[i])>40 && clen(f.answers[j])>40 && jaccard(f.answers[i],f.answers[j])>.5)
        queue.push(`Q${i+1}와 Q${j+1}의 내용이 거의 같습니다`);
  if(f.answers.some(repeatedSentence)) queue.push('같은 문장이 3회 이상 반복됩니다');
  if(f.pid!=='p2' && clen(f.answers[0])>40 && !hasProperNoun(f.answers[0]))
    queue.push('Q1에 분반명·개념명 같은 고유명사가 없습니다');
  return {total, short, writerOk, late, nothing, score, queue};
}
function bigrams(s){
  const t = String(s).replace(/[\s.,!?~·…"'()\[\]]/g,''), set = {};
  for(let i=0;i<t.length-1;i++) set[t.slice(i,i+2)] = 1;
  return set;
}
function jaccard(a,b){
  const A = bigrams(a), B = bigrams(b); let inter=0, uni=0;
  for(const k in A){ uni++; if(B[k]) inter++; }
  for(const k in B){ if(!A[k]) uni++; }
  return uni ? inter/uni : 0;
}
function hasProperNoun(s){
  return /[A-Za-z]{2,}/.test(s) || /\d+\s*(회|월|일|차|주차|개|명|위|등|%)/.test(s)
      || /[「『"'][^」』"']{2,}[」』"']/.test(s) || /\S{2,}(반|공모전|대회|프로젝트)/.test(s);
}
function repeatedSentence(s){
  const parts = String(s).split(/[.!?\n]+/).map(x=>x.replace(/\s/g,'')).filter(x=>x.length>6);
  const seen = {}; let max = 0;
  parts.forEach(p=>{ seen[p]=(seen[p]||0)+1; if(seen[p]>max) max=seen[p]; });
  return max >= 3;
}

      ${line('마감', !j.late, `${fmt(period(f.pid).due)} · ${ddayTag(period(f.pid).due)}`)}
    </tbody></table></div>

  </div>`;
}
function modalReview(g, pid){
  g = g || MYGROUPS()[0];
  pid = pid || 'p9';
  const spec = reviewSpec(g.track, pid);
  const minSum = spec.reduce((a,q)=>a+q.min,0);
  return `<form class="modal stack-sm" data-act="submit-review" data-gid="${g.id}">
    <div class="row-between"><h2 class="h3">월별 조 후기 작성</h2>
      <button class="btn btn-ghost btn-sm" type="button" data-act="close" aria-label="닫기">${ic('x',16)}</button></div>
    <p class="small">조당 월 1건 · 집필자 매월 로테이션 · ${REV_MIN}~${REV_MAX}자 · 요건 충족 0.8점 · 카페 게시는 운영진 대행</p>

    <div class="row" style="gap:var(--sp-3);align-items:flex-end">
      ${groupPicker(g, 'review-group')}
      <label class="field" style="flex:1;min-width:150px"><span>제출 월</span>
        <select class="select" name="pid" data-act="review-period">
          ${PERIODS.map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${x.label}</option>`).join('')}
        </select></label>
    </div>
    ${groupMeta(g)}
    ${REVIEWS.some(r=>r.gid===g.id && r.pid===pid)
      ? callout('warn','check',`이 조는 <strong>${period(pid).label} 후기가 이미 제출</strong>되어 있습니다 (집필 ${esc(REVIEWS.find(r=>r.gid===g.id && r.pid===pid).author)}). 후기는 조당 월 1건입니다.`)
      : ''}
    ${pid==='p2' ? callout('info','check','2월 후기는 <strong>필수2 최종 회고와 겸합니다.</strong> 같은 달에 두 번 쓰지 않습니다.') : ''}

    <div class="row" style="gap:var(--sp-3);align-items:flex-end">
      <label class="field" style="flex:1"><span>이번 달 집필자</span>
        <select class="select" name="writer" data-live>
          <option value="">— 선택 —</option>
          ${g.members.map(m=>{
            const w = wroteMonths(g, m.name);
            return `<option value="${esc(m.name)}">${esc(m.name)}${w.length?'  ('+w.join('·')+' 집필)':'  (미집필)'}</option>`;
          }).join('')}
        </select></label>
    </div>
    ${callout('info','link','후기는 <strong>LMS에만 제출</strong>하면 됩니다. 네이버카페 게시는 <strong>운영진이 대신 올립니다.</strong>')}
    <div class="rot">
      ${g.members.map(m=>{
        const w = wroteMonths(g, m.name);
        return `<span class="badge ${w.length?'badge-muted':'badge-danger'} badge-sm">${esc(m.name)} · ${w.length?w.join('·'):'집필 이력 없음'}</span>`;
      }).join('')}
    </div>
    <p class="caption">순번은 조가 정합니다. 시스템은 이번 달 집필자가 지정됐는지만 봅니다. 기수 종료까지 한 번도 집필하지 않은 조원은 상점 +2에서 제외됩니다.</p>

    <fieldset class="fset"><legend>후기 문항 — 최소 합계 ${minSum}자</legend>
      ${spec.map((q,i)=>`<label class="field">
        <span>Q${i+1}. ${esc(q.t)}</span>
        ${q.g?`<span class="caption">${esc(q.g)}</span>`:''}
        <textarea class="textarea" name="a${i}" rows="3" data-live data-min="${q.min}"
          placeholder="${esc((q.ph&&q.ph[g.track])||'')}"></textarea>
        <div class="qmeter"><span class="qbar"><i data-bar="a${i}"></i></span>
          <span class="num" data-count="a${i}">0 / ${q.min}자</span></div>
      </label>`).join('')}
    </fieldset>

    <div id="rjudge-slot">${reviewJudgePanel({g, pid, spec, answers:spec.map(()=>''), writer:''})}</div>
    <div class="row"><button class="btn btn-primary btn-lg" type="submit">등록</button>
      <button class="btn btn-secondary btn-lg" type="button" data-act="close">취소</button></div>
  </form>`;
}
function modalAppeal(){
  return `<form class="modal stack-sm" data-act="submit-appeal">
    <div class="row-between"><h2 class="h3">채점 이의신청</h2>
      <button class="btn btn-ghost btn-sm" type="button" data-act="close" aria-label="닫기">${ic('x',16)}</button></div>
    <p class="small">채점표 공지 후 1주 이내에 접수할 수 있습니다.</p>
    <label class="field"><span>대상 규칙</span><select class="select" name="rule">
      ${['M1 필수1','M2 필수2','M3 만남 요건','M4 증빙·참여','E 가산','P1 지각 제출'].map(t=>`<option>${t}</option>`).join('')}</select></label>
    <label class="field"><span>사유</span><textarea class="textarea" name="reason" rows="4" required placeholder="어떤 근거가 반영되지 않았는지 적어 주세요."></textarea></label>
    <div class="row"><button class="btn btn-primary btn-lg" type="submit">접수</button>
      <button class="btn btn-secondary btn-lg" type="button" data-act="close">취소</button></div>
  </form>`;
}
function modalSchedule(){
  return `<div class="modal stack-sm">
    <div class="row-between"><h2 class="h3">조별활동 일정</h2>
      <button class="btn btn-ghost btn-sm" type="button" data-act="close" aria-label="닫기">${ic('x',16)}</button></div>
    <p class="small">일정은 별도 목록 탭 없이 데드라인 안내로만 제공합니다.</p>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">구분</th><th scope="col">일정</th><th scope="col">기간·기한</th><th scope="col" class="t-num">남은 기간</th></tr></thead>
      <tbody>${SCHEDULE.map(s=>`<tr><td><span class="badge badge-muted badge-sm">${s.tag}</span></td><td>${esc(s.t)}</td>
        <td class="num">${s.range||fmt(s.d)}</td>
        <td class="t-num">${dday(s.d)<0?'종료':ddayTag(s.d)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

/* ─────────────────────────────────────────────
   라우터 · 렌더 · 이벤트
   ───────────────────────────────────────────── */
const GNB = [
  {t:'정규반', href:'#/dashboard', match:['dashboard','class','learning','reviews','group']},
  {t:'취업', href:'#/career/contest', match:['career']},
  {t:'Learning'},
  {t:'Report'}, {t:'커뮤니티', href:'#/community/notice', match:['community']},
  {t:'현직자 신청'}, {t:'마이페이지'}
];
function parse(){
  const h = (location.hash||'#/dashboard').slice(2).split('/');
  return {v:h[0]||'dashboard', a:h[1], b:h[2]};
}
const TEAM_ROUTES = ['learning','reviews','group'];
const REGULAR_ROUTES = ['dashboard','class'].concat(TEAM_ROUTES);
function subnav(v){
  /* 조별활동은 정규반 하위 탭 — 실제 서비스(bdai.co.kr/regular/team-activity/)와 동일한 위치 */
  if(REGULAR_ROUTES.includes(v)){
    const onTeam = TEAM_ROUTES.includes(v);
    const items = [
      {t:'정규반 홈', href:'#/dashboard'},
      {t:'조별활동 홈', href:'#/learning'},
      {t:'정규반 소개'}, {t:'프로젝트반 소개', n:true}, {t:'분반 추천받기', n:true},
      {t:'강사소개'}, {t:'모집 신청'}
    ];
    const r = parse();
    const sub = [{id:'home',t:'조별활동 홈',ic:'users'},{id:'apply',t:'신청',ic:'pencil'},{id:'logs',t:'활동일지',ic:'book'},{id:'reviews',t:'후기',ic:'message'},{id:'notice',t:'공지',ic:'mega'},{id:'grievance',t:'신문고',ic:'flag'}];
    const cur = v==='learning' ? (r.a||'home') : (v==='reviews' ? 'reviews' : '');
    const isOn = x => x.href==='#/learning' ? onTeam : (x.href==='#/dashboard' ? !onTeam : false);
    return `<div class="subnav"><nav class="subnav-in" aria-label="정규반 메뉴">
      ${items.map(x=>x.href
        ? `<a class="nav-link" href="${x.href}" ${isOn(x)?'aria-current="page"':''}>${x.t}</a>`
        : `<button class="nav-link" type="button" data-act="toast" data-msg="이 데모는 정규반 > 조별활동 탭만 구현했습니다">${x.t}${x.n?`<span class="badge badge-warning badge-sm" style="margin-left:6px">N</span>`:''}</button>`).join('')}
    </nav>
    ${onTeam ? `<div class="subnav-2"><div class="subnav-in"><div class="chipset" role="group" aria-label="조별활동 하위 메뉴">
      ${sub.map(x=>`<a class="chip" href="${x.id==='home'?'#/learning':'#/learning/'+x.id}" ${cur===x.id?'aria-current="page"':''}>${ic(x.ic,16)}${x.t}</a>`).join('')}
    </div></div></div>` : ''}</div>`;
  }
  if(v==='community'){
    return `<div class="subnav"><nav class="subnav-in" aria-label="커뮤니티 메뉴">
      <a class="nav-link" href="#/community/notice" ${parse().a==='notice'?'aria-current="page"':''}>공지</a>
      <a class="nav-link" href="#/community/qna" ${parse().a==='qna'?'aria-current="page"':''}>Q&amp;A</a>
    </nav></div>`;
  }
  return '';
}
function render(){
  const r = parse(); S.route = r;
  document.getElementById('gnb').innerHTML = GNB.map(g=>g.href
    ? `<a class="nav-link" href="${g.href}" ${g.match.includes(r.v)?'aria-current="page"':''}>${g.t}</a>`
    : `<button class="nav-link" type="button" data-act="toast" data-msg="이 데모는 조별활동 관련 화면만 구현했습니다">${g.t}</button>`).join('');
  document.getElementById('subnav').innerHTML = subnav(r.v);
  const main = document.getElementById('main');
  main.innerHTML =
    r.v==='class' ? viewClass(r.a) :
    r.v==='learning' ? (r.a==='apply' ? viewApply()
                        : ['logs','reviews','notice','grievance'].includes(r.a) ? viewLearningSub(r.a) : viewLearning()) :
    r.v==='reviews' ? viewReviews() :
    r.v==='group' ? viewGroup(r.a, r.b||'info') :
    r.v==='community' ? (r.a==='qna' ? viewQna() : viewNoticeBoard()) :
    r.v==='career' ? viewContestBoard() :
    viewDashboard();
  layer();
}
function layer(){
  const el = document.getElementById('layer');
  if(!S.modal){ el.innerHTML=''; return; }
  const g = G(S.modal.gid) || MYGROUPS()[0];
  const inner = S.modal.kind==='log' ? modalLog(g, S.modal.pid, S.modal.stage)
    : S.modal.kind==='review' ? modalReview(g, S.modal.pid)
    : S.modal.kind==='appeal' ? modalAppeal()
    : modalSchedule();
  el.innerHTML = `<div class="overlay" data-act="close-bg" role="dialog" aria-modal="true">${inner}</div>`;
  const first = el.querySelector('input,select,textarea,button');
  if(first) first.focus();
}
let toastTimer;
function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 2600);
}
function syncCounters(form){
  form.querySelectorAll('[data-min]').forEach(el=>{
    const n = el.getAttribute('name'), min = Number(el.dataset.min);
    const c = form.querySelector('[data-count="'+n+'"]');
    const b = form.querySelector('[data-bar="'+n+'"]');
    if(!c) return;
    const v = clen(el.value);
    c.textContent = v + ' / ' + min + '자';
    c.className = 'num ' + (v>=min ? 'ok' : (v>0 ? 'low' : ''));
    if(b){ b.style.width = Math.min(100, Math.round(v/min*100)) + '%';
           b.className = v>=min ? 'ok' : ''; }
  });
}
function syncFiles(form){
  form.querySelectorAll('input[type=file]').forEach(el=>{
    const tag = form.querySelector('[data-file="'+el.getAttribute('name')+'"]');
    if(!tag) return;
    const n = el.files ? el.files.length : 0;
    tag.textContent = n ? Array.prototype.map.call(el.files, f=>f.name).join(', ') : '선택된 파일 없음';
    tag.className = 'filename' + (n ? ' has' : '');
  });
}
function refreshJudge(root){
  if(!root) return;
  const pick = root.querySelector('[name=m2-pick]');
  if(pick){
    const body = root.querySelector('[name=m2-body]');
    const spec = logSpec(G(root.dataset.gid) || {track:root.dataset.track}, root.querySelector('[name=pid]').value, root.dataset.stage);
    const opt = spec.m2.choice.find(o=>o.v===pick.value);
    if(body && opt){ body.dataset.min = opt.min; body.placeholder = opt.ph; }
  }
  syncCounters(root);
  syncFiles(root);
  ['e1','e3'].forEach(k=>{
    const cb = root.querySelector('[name="'+k+'"]');
    const panel = root.querySelector('[data-panel="'+k+'"]');
    const box = root.querySelector('[data-ebox="'+k+'"]');
    if(!cb || !panel) return;
    panel.hidden = !cb.checked;
    if(box) box.className = 'ebox' + (cb.checked ? ' on' : '');
  });
  if(root.dataset.act==='submit-log'){
    const g = G(root.dataset.gid);
    document.getElementById('judge-slot').innerHTML = judgePanel(g, readLogForm(root));
  } else if(root.dataset.act==='submit-review'){
    document.getElementById('rjudge-slot').innerHTML = reviewJudgePanel(readReviewForm(root));
  }
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act;
  if(act==='toast'){ toast(t.dataset.msg); }
  else if(act==='scroll'){ const el = document.getElementById(t.dataset.to);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
  else if(act==='chip'){ S.f[t.dataset.scope][t.dataset.key] = t.dataset.val;
    if(t.dataset.scope==='apply' && t.dataset.key==='track') S.f.apply.picks = [];
    render(); }
  else if(act==='apply-item'){ const p = S.f.apply.picks, i = p.indexOf(t.dataset.id);
    if(i<0) p.push(t.dataset.id); else p.splice(i,1); render(); }
  else if(act==='like'){ const r = REVIEWS.find(x=>x.id===t.dataset.id);
    r.liked = !r.liked; r.likes += r.liked?1:-1; render(); }
  else if(act==='switch-cycle'){
    const g = G(t.dataset.gid), k = t.dataset.kind;
    const nm = k==='contest' ? '' : (k==='cert' ? 'SQLD 자격증' : '시계열 분석 스터디');
    switchCycle(g, k, nm); render();
    toast(kindName(k)+' 사이클로 전환했습니다 — 다음 일지의 필수1이 S1으로 바뀝니다');
  }
  else if(act==='demo-finish'){
    const g = G(t.dataset.gid);
    MILESTONES.forEach(m=>{ g.reached = g.reached||{}; if(!g.reached[m.id]) g.reached[m.id] = TODAY.toISOString().slice(0,10); });
    render(); toast('S4까지 완료 처리했습니다 (데모)');
  }
  else if(act==='toggle-empty'){ S.learningEmpty = !S.learningEmpty; render(); }
  else if(act==='cal'){ if(t.dataset.m){ S.cal = t.dataset.m; render(); } }
  else if(act==='open-notice'){ S.openNotice = S.openNotice===t.dataset.id ? null : t.dataset.id; render(); }
  else if(act==='modal'){ S.modal = {kind:t.dataset.kind, gid:t.dataset.gid, pid:t.dataset.pid||'p9'}; layer(); }
  else if(act==='close'){ S.modal=null; layer(); }
  else if(act==='close-bg'){ if(e.target===t){ S.modal=null; layer(); } }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.act==='q'){ S.f[t.dataset.scope].q = t.value; const pos=t.selectionStart; render();
    const nx = document.querySelector('[data-act=q]'); if(nx){ nx.focus(); nx.setSelectionRange(pos,pos); } }
  else if(t.hasAttribute('data-live')){ refreshJudge(t.closest('form')); }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.act==='sel'){ S.f[t.dataset.scope][t.dataset.key] = t.value; render(); }
  else if(t.dataset.act==='log-period' || t.dataset.act==='review-period'){
    S.modal.pid = t.value; layer(); }
  else if(t.dataset.act==='review-group' || t.dataset.act==='log-group'){
    S.modal.gid = t.value; S.modal.stage = null; layer(); }
  else if(t.dataset.act==='log-stage'){ S.modal.stage = t.value; layer(); }
  else if(t.hasAttribute('data-live')){ refreshJudge(t.closest('form')); }
});
document.addEventListener('submit', e=>{
  const f = e.target; e.preventDefault();
  const act = f.dataset.act;
  if(act==='submit-log'){
    const g = G(f.dataset.gid), v = readLogForm(f), j = autoJudge(g, v);
    const stg = g.track==='contest' ? (f.dataset.stage||null) : null;
    if(stg){
      g.reached = g.reached || {};
      if(!g.reached[stg]) g.reached[stg] = TODAY.toISOString().slice(0,10);
      if((g.kind||'contest')==='contest'){
        if(v.cname.trim()) g.contest = v.cname.trim();
        if(v.cdue) g.deadline = v.cdue;
      } else if(v.cname.trim()) g.altName = v.cname.trim();
    }
    const flat = part => part.items.filter(it=>it.v).map(it=>it.l+' — '+it.v).join(' / ');
    const body = [flat(v.m1), flat(v.m2)].filter(Boolean).join(' | ') || '(항목 미작성)';
    LOGS.unshift({id:'j'+(LOGS.length+1), gid:g.id, pid:v.pid, stage:stg, type:deriveType(v), loc:deriveLoc(v.off, v.on),
      cname:v.cname.trim()||null, cdue:v.cdue||null, calt:v.calt.trim()||null,
      date:TODAY.toISOString().slice(0,10), author:g.members.find(m=>m.me)?.name || g.members[0].name,
      title:v.title, join:v.join, of:memberCount(g),
      off:v.off, on:v.on,
      photo:v.photo, doc:v.doc, files:(v.photoF||[]).concat(v.docF||[]),
      bonus:['e1','e3'].filter(k=>j.eOk[k]).map(k=>({e1:'E1 자율활동',e3:'E3 공모전·자격증'})[k])
        .concat(j.extra>0 ? ['E2 추가 만남 '+j.extra+'회'] : []),
      status: dday(period(v.pid).due)<0?'지각':'정상', score:null, graded:false,
      body});
    S.modal=null; render();
    toast(`활동일지를 제출했습니다 — ${stg?stg+' 도달 · ':''}자동 판정 ${money(j.total)}점 (M1 ${money(j.M1)} · M2 ${money(j.M2)})`);
  } else if(act==='submit-review'){
    const v = readReviewForm(f), j = judgeReview(v), g = v.g;
    if(j.nothing){ toast('후기 내용을 입력해 주세요'); return; }
    const name = v.writer || (g.members.find(m=>m.me)?.name || g.members[0].name);
    REVIEWS.unshift({id:'r'+(REVIEWS.length+1), gid:g.id, pid:v.pid, author:name,
      mask:name.slice(0,2)+'*', date:TODAY.toISOString().slice(0,10), likes:0, liked:false,
      score:j.score, chars:j.total, queue:j.queue,
      text:v.answers.map((a,i)=>a?(v.spec[i].t+' — '+a):'').filter(Boolean).join('  ')});
    S.modal=null; render();
    toast(`후기를 등록했습니다 — M5 ${money(j.score)}점${j.queue.length?' · 검수 큐 '+j.queue.length+'건':''}`);
  } else if(act==='submit-appeal'){
    S.modal=null; render(); toast('이의신청이 접수되었습니다 — 처리 기한 1주');
  } else if(act==='submit-grievance'){
    S.grievances.unshift({id:'gr'+(S.grievances.length+1), title:f.querySelector('[name=title]').value,
      date:TODAY.toISOString().slice(0,10), state:'접수됨'});
    render(); toast('신문고에 익명으로 접수했습니다');
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.modal){ S.modal=null; layer(); } });
window.addEventListener('hashchange', ()=>{ window.scrollTo(0,0); render(); });
render();
</script>
